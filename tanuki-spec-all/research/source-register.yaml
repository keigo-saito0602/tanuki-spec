version: "1.1"
updated: "2026-07-15"
policy: >-
  根拠資料の原本はリポジトリに登録せず、抽出・一般化済みの品質観点だけを利用する。
  この登録簿には原本のパス、ファイル名、版、ハッシュを記載しない。
sources:
  - id: requirements-guidance
    scope: 要件定義における業務・機能・非機能・移行・文書化の観点
    locator_format: "資料内の位置番号"
  - id: design-guidance
    scope: 基本設計・詳細設計における構成・データ・連携・運用の観点
    locator_format: "資料内の位置番号"
  - id: requirements-quality
    scope: 要件定義の品質特性別チェック観点
    locator_format: "観点区分"
  - id: design-quality
    scope: 設計の品質特性別チェック観点
    locator_format: "観点区分"
  - id: design-quality-google
    scope: 設計の代替案・横断的関心事・リスクを確認する観点
    locator_format: "観点区分"
  - id: design-quality-microsoft
    scope: 信頼性・セキュリティ・コスト・運用・性能の設計品質観点
    locator_format: "観点区分"
  - id: design-quality-nttdata
    scope: 機能仕様の完全性・網羅性・整合性・明確性・実装可能性の観点
    locator_format: "観点区分"
  - id: non-functional-quality
    scope: 性能・可用性・セキュリティ等の非機能観点
    locator_format: "観点区分"
  - id: ai-quality
    scope: 生成AI活用時の品質管理・検証・改善の観点
    locator_format: "観点番号"
