# =============================================================================
# spec-items.yaml — 品質項目マスター（SSOT: Single Source of Truth）
# -----------------------------------------------------------------------------
# 要件定義書/基本設計書/詳細設計書に「載せるべき品質項目」の唯一の正本。
# テンプレート生成・カバレッジ評価・AI品質評価はすべてこのファイルを参照する。
# 資料改訂で項目が増減した場合、このファイルだけを直せば全機能が追随する。
#
# 根拠6分類（内容を抽出・一般化して利用）:
#   - 要件定義観点   = 要件定義における業務・機能・非機能・移行・文書化の観点
#   - 設計観点       = 基本/詳細設計における構成・データ・連携・運用の観点
#   - 要件品質観点   = 要件定義の品質特性別チェック観点
#   - 設計品質観点   = 設計の品質特性別チェック観点
#   - 非機能観点     = 性能・可用性・セキュリティ等の非機能観点
#   - AI品質観点     = 生成AI活用時の品質管理・検証・改善の観点
#
# フィールド定義:
#   id        … 安定した一意キー（テンプレ/評価の突き合わせ用。変更しない）
#   name      … 項目名（見出しになる）
#   purpose   … なぜ必要か（1文）
#   required  … true=必須 / false=任意 / conditional=条件付き必須（conditionに条件）
#   source    … 根拠分類＋資料内の位置（原本のパス・ファイル名は記載しない）
#   aspects   … 関連するISO25010系品質特性（カバレッジの観点タグ）
#   new       … true=ユーザの叩き台に無かった新規項目
# =============================================================================

meta:
  version: "1.2.0"
  updated: "2026-07-18"
  language: ja
  description: 業務システム/Webアプリの要件定義・設計に載せるべき品質項目マスター
  approval_status: approved
  approval_note: オーナー(KEIGO)承認済み(2026-07-18)。Webアプリ向け軽量化(codex-task-04)を反映のうえ承認。

# ISO25010系の品質特性タクソノミー（aspects で参照するタグの正体）
quality_characteristics:
  - {id: functional,    label: 機能性,             note: 業務・機能・データ・連携が要求を満たすか}
  - {id: usability,     label: 操作性,             note: 利用者の習熟負荷・操作ミスを抑えるUI}
  - {id: reliability,   label: 信頼性,             note: 障害許容度・回復・整合性}
  - {id: performance,   label: 性能,               note: スループット・TAT・容量}
  - {id: scalability,   label: 拡張性,             note: 業務量増加・機能追加への追随}
  - {id: operability,   label: 運用性,             note: 通常/障害/保全時の運用}
  - {id: maintainability, label: 保守性,           note: 分かり易さ・変更容易性}
  - {id: portability,   label: 移行性,             note: 移行方式・互換性・切り戻し}
  - {id: security,      label: セキュリティ,       note: 認証/認可/暗号/監視/法規制}
  - {id: environment,   label: システム環境エコロジー, note: 設備・環境負荷・効果測定}
  - {id: documentation, label: ドキュメンテーション, note: 体系・用語・記述の統一}

# =============================================================================
# 工程別 品質項目
# =============================================================================
phases:

  # ---------------------------------------------------------------------------
  requirements:
    label: 要件定義
    goal: ユーザーストーリー/顧客のしたいことを起点に、作るべきものの範囲と品質水準を確定する
    audience: 非技術者（クライアント・経営視点）
    reading_hint: まずサマリだけ読んで違和感を洗い出し、本論で裏取りする（2パス読み）
    legend:
      - "**太字** = 決定事項"
      - "⚠️ = リスク"
      - "❓ = 未決事項"
    categories:

      - id: req-summary
        label: サマリ（最初に読む）
        items:
          - id: req-exec-summary
            name: エグゼクティブサマリ（何を作る／なぜ／意思決定のお願い）
            purpose: 忙しい非技術者が1画面で判断できるよう結論を冒頭に置く
            required: true
            source: 認知科学(Minto/BLUF)
            aspects: [documentation]
            new: true
          - id: req-open-questions
            name: 未決事項・スコープ外
            purpose: 決めていないことを可視化し空白を指摘できるようにする
            required: true
            source: 認知科学(未決明示)
            aspects: [documentation]
            new: true
          - id: req-decision-summary
            name: 決定事項サマリ（表）
            purpose: 決定を一覧化しスキャン読みで追えるようにする
            table_hint: "| 決定事項 | 決めた内容 | 根拠 |"
            required: false
            source: 認知科学(チャンク化)
            aspects: [documentation]
            new: true
          - id: req-glossary
            name: 用語集
            purpose: 専門用語を集約し本文の探索コストを下げる
            table_hint: "| 用語 | 定義 |"
            required: false
            source: 認知科学(Plain Language)
            aspects: [documentation]
            new: true

      - id: req-business
        label: 業務要件
        review_checklist:
          - 目的は事業のねらいと整合しているか
          - スコープ内/外の線引きは明確で漏れがないか
          - 関係者の役割・権限に抜けはないか
        items:
          - id: req-purpose
            name: システム化の目的・背景（経営戦略との紐づけ）
            purpose: 「真の目的」を明確化し、以後の要件取捨選択・優先順位判断の拠り所にする
            required: true
            source: 要件定義観点 S21/S107
            aspects: [functional]
            new: true
          - id: req-scope
            name: システム化対象業務・スコープ定義（対象/対象外/範囲）
            purpose: システム化範囲を確定し対象漏れ・認識齟齬を防ぐ
            table_hint: "| 業務／機能 | 対象／対象外 | 理由 |"
            required: true
            source: 要件品質観点(機能性)／要件定義観点 S21
            aspects: [functional]
            new: true
          - id: req-stakeholder
            name: ステークホルダー・関係者体制（役割・権限・組織）
            purpose: 所掌の違いによる要求スコープ・実現レベルの食い違いを防ぐ
            table_hint: "| 関係者 | 役割 | 権限 |"
            required: true
            source: 要件定義観点 S22/S56/S107
            aspects: [functional]
            new: true
          - id: req-bizflow
            name: 業務フロー（As-Is／To-Be、インパクト分析）
            purpose: 現状と新業務の変化・影響を可視化し見直し漏れを防ぐ
            required: true
            source: 要件定義観点 S23-25
            aspects: [functional]
            new: false
          - id: req-userstory
            name: ユーザーストーリー／利用シーン
            purpose: 利用者視点の利用文脈（Who/What/Why）を起点として明確化する
            required: true
            source: 叩き台／cc-sdd(spec-requirements)
            aspects: [functional, usability]
            new: false

      - id: req-function
        label: 機能要件
        review_checklist:
          - 各機能に「誰が・いつ・何を」が書かれているか
          - 優先度（Must/Should/Could）が付いているか
          - 例外・エラー時の振る舞いに触れているか
        items:
          - id: req-func-list
            name: 機能要件一覧・詳細（P5W2Hで整理）
            purpose: Priority/Who/When&条件/What&量/Where/Why/How/HowMuchの見落としを防ぐ
            table_hint: "| 機能ID | 機能名 | 誰が・いつ・何を | 優先度 |"
            required: true
            source: 要件定義観点 S111
            aspects: [functional]
            new: false
          - id: req-priority
            name: 要件の優先順位方針（分類・優先度基準）
            purpose: 要件をグループ化し優先度判断をぶれさせない
            required: true
            source: 要件定義観点 S112
            aspects: [functional]
            new: true

      - id: req-data
        label: データ要件
        review_checklist:
          - 扱うデータの種類・項目に漏れはないか
          - 個人情報・機微データの扱いが明示されているか
          - 画面・帳票の入出力が業務と一致しているか
        items:
          - id: req-datamodel
            name: データ要件・データモデル（ERD/DFD、CRUD分析）
            purpose: データ構造・流れを独立の柱で整理しDB設計との手戻りを防ぐ
            required: true
            source: 要件品質観点(機能性)／要件定義観点 S24/S36
            aspects: [functional]
            new: true
          - id: req-code
            name: コード設計・コード体系
            purpose: JIS/業界標準・既存コード表との整合を事前確認する
            table_hint: "| コード名 | 桁数・形式 | 準拠標準／既存表 |"
            required: false
            source: 要件品質観点(機能性)
            aspects: [functional]
            new: true
          - id: req-io
            name: 入出力（画面・帳票）要件・UI標準
            purpose: 入出力様式・操作方法を統一し操作ミスを抑制する
            required: true
            source: 要件品質観点(操作性)
            aspects: [usability]
            new: false
          - id: req-interface
            name: 他システム連携・外部インターフェース要件
            purpose: 授受方式・タイミング・形式を明確化し結合試験の手戻りを防ぐ
            required: true
            source: 要件品質観点(機能性)／要件定義観点 S51
            aspects: [functional]
            new: false

      - id: req-platform
        label: システム基盤・処理方式
        review_checklist:
          - 処理方式（オンライン/バッチ等）が機能と整合しているか
          - 外部システム連携の授受方式・タイミングが明確か
        items:
          - id: req-processing
            name: 処理方式・システム構成要件（オンライン/バッチ等の選定）
            purpose: 機能要件と方式を整合させ開発規模・予算の見誤りを防ぐ
            required: true
            source: 要件定義観点 S26-27/S33
            aspects: [performance, scalability]
            new: true
          - id: req-pkg-fitgap
            name: 業務パッケージ(PKG)導入時のFIT&GAP分析
            purpose: 過度なカスタマイズによる保守困難化・サポート切れを回避する
            required: conditional
            condition: 業務パッケージ/SaaSを採用する場合
            source: 要件定義観点 S28-30
            aspects: [functional, maintainability]
            new: true

      - id: req-nfr
        label: 非機能要件
        review_checklist:
          - 性能・可用性・セキュリティの目標が数値で書かれているか
          - 「対象外」とした非機能に理由があるか
        items:
          - id: req-nfr-breakdown
            name: 非機能要件の観点別ブレークダウン
            purpose: 一括りの「非機能要件」での抜け漏れを防ぐ（詳細は non_functional を展開）
            required: true
            source: 要件品質観点(各シート)／要件定義観点 S73-83／非機能観点
            aspects: [reliability, performance, scalability, operability, maintainability, portability, security, environment]
            expands: non_functional
            new: false
          - id: req-nfr-business
            name: 業務系非機能要件（業務運用視点の可用性・保守性・移行性等）
            purpose: 基盤系だけでなく業務運用側の非機能も明文化する
            required: true
            source: 要件定義観点 S81-83
            aspects: [operability, reliability, portability]
            new: true

      - id: req-quality
        label: 品質・受け入れ
        review_checklist:
          - 受け入れ条件が合否判定できる形になっているか
          - サービス開始判定（カットオーバー基準）があるか
        items:
          - id: req-acceptance
            name: 受け入れ条件・検収基準
            purpose: 完成の合格判定基準を明確にする。受け入れ条件はEARS 5パターン（常時/イベント駆動/状態駆動/異常系/オプション）で書き、具体シナリオは受入試験(AC)のGherkinへ落とす（references/ears-gherkin-guidelines.md）
            required: true
            source: 叩き台／cc-sdd(EARS受け入れ基準)
            aspects: [functional]
            new: false
          - id: req-cutover-criteria
            name: カットオーバークライテリア（サービス開始判定基準）
            purpose: 本番移行可否を業務・システム・試験網羅性・品質・体制から段階判定する
            required: conditional
            condition: 本番リリース可否を正式なゲートで判定する場合
            source: 要件定義観点 S109-110
            aspects: [portability, reliability]
            new: true
          - id: req-test-support
            name: 試験支援要件（試験環境・データ・シナリオ抽出可能性）
            purpose: 要件からテスト項目が導出できることを事前確認しV字の試験漏れを防ぐ
            required: true
            source: 要件品質観点(移行性)／要件定義観点 S116
            aspects: [reliability]
            new: true

      - id: req-migration
        label: 移行・運用
        review_checklist:
          - 移行方式と失敗時の切り戻し手順があるか
          - 通常時・障害時の運用分担が決まっているか
        items:
          - id: req-migration-plan
            name: 移行要件・移行計画（方式・切り戻し・リハーサル・PoNR）
            purpose: 移行方式と失敗時の切り戻し手順を事前定義しトラブルを防ぐ
            required: conditional
            condition: 既存システム・既存データからの移行がある場合
            source: 要件品質観点(移行性)／要件定義観点 S51
            aspects: [portability]
            new: true
          - id: req-operation
            name: 運用要件（通常/障害時/保守運用の作業分担）
            purpose: 平常時・故障時・保全時の運用分担を明確化する
            required: true
            source: 要件品質観点(運用性/保守性)
            aspects: [operability, maintainability]
            new: true
          - id: req-kpi
            name: 業務改善効果・KPI測定項目
            purpose: システム化効果を定量評価できる指標を要件段階で定義する
            required: false
            source: 要件品質観点(機能性/環境)／要件定義観点 S102
            aspects: [environment, functional]
            new: true

      - id: req-pm
        label: プロジェクト管理・ドキュメント
        review_checklist:
          - 予算・期間・技術の制約が明示されているか
          - 廃案・不採用の理由が記録されているか
          - 法規制・コンプライアンス対応が確認されているか
        items:
          - id: req-constraints
            name: 制約・前提条件
            purpose: 予算・期間・技術等の制約を明示する
            required: true
            source: 叩き台
            aspects: [functional]
            new: false
          - id: req-issue-log
            name: 課題管理・検討経緯記録（不採用案・廃案理由を含む）
            purpose: 論点の蒸し返し時に判断根拠を遡れるようにし手戻りを防ぐ
            table_hint: "| 課題 | 検討経緯 | 結論／廃案理由 |"
            required: true
            source: 要件定義観点 S5/S111
            aspects: [documentation]
            new: true
          - id: req-team
            name: 開発体制・スキル要件（要員計画）
            purpose: 必要な業務知識・技術知識を持つ人材確保を確認する
            table_hint: "| 役割 | 必要スキル | 人数 |"
            required: conditional
            condition: 複数名または外部委託を含む開発体制の場合
            source: 要件定義観点 S22/S108
            aspects: [functional]
            new: true
          - id: req-compliance
            name: 法規制・コンプライアンス対応要件
            purpose: 個人情報保護法・PCIDSS等への対応可否を要件段階で確認する
            required: true
            source: 要件品質観点(セキュリティ)
            aspects: [security]
            new: true
          - id: req-doc-system
            name: ドキュメント体系・成果物一覧・用語統一
            purpose: 粒度・用語を統一し後工程・保守での解釈齟齬を防ぐ
            table_hint: "| 成果物 | 目的 | 作成タイミング |"
            required: false
            source: 要件品質観点(ドキュメンテーション)／要件定義観点 S113-115
            aspects: [documentation]
            new: true

  # ---------------------------------------------------------------------------
  basic_design:
    label: 基本設計
    goal: 外部から見える仕様（画面/API/帳票/外部IF/データ/非機能方針）を確定する
    audience: 第三者の技術者
    reading_hint: 実装者/テスター/運用セキュリティの3視点で読み分ける（PBR）
    legend:
      - "**太字** = 決定事項"
      - "⚠️ = リスク"
      - "❓ = 未決事項"
    pbr_guide:
      - "実装者視点で確認: I/F・データ型・例外は実装可能な粒度か"
      - "テスター視点で確認: 各仕様に検証可能な合否条件があるか"
      - "運用/セキュリティ視点で確認: 認証・ログ・権限・障害時が定義されているか"
    categories:
      - id: bd-summary
        label: サマリ（最初に読む）
        items:
          - id: bd-adr-summary
            name: "設計判断サマリ（ADR: 決定／代替案／トレードオフ）"
            purpose: 主要な設計判断を第三者が検証できる形で一覧化する
            required: true
            source: 認知科学(ADR/Nygard)
            aspects: [maintainability, documentation]
            new: true

      - id: bd-cat-biz
        label: 業務・機能設計
        review_checklist:
          - 業務の分割・処理形態は変更に強いか
          - 各機能のINPUT/PROCESS/OUTPUTが定義されているか
          - 処理起動条件（バッチ/オンライン）に漏れはないか
        items:
          - id: bd-biz-system
            name: 業務体系・業務処理概要
            purpose: 仕様変更に強い業務分割・処理形態を明確化する
            required: true
            source: 設計品質観点(機能性)
            aspects: [functional]
          - id: bd-trigger
            name: 処理起動条件一覧
            purpose: バッチ/オンライン/センタカットの起動条件を運用設計・試験の基礎にする
            table_hint: "| 処理 | 種別（バッチ／オンライン） | 起動条件・契機 |"
            required: true
            source: 設計品質観点(機能性)
            aspects: [functional, operability]
          - id: bd-biz-rule
            name: 業務規制条件・処理内容の明確化
            purpose: 規制すべきエラー種別・更新編集方法を明確化し詳細設計の土台にする
            required: true
            source: 設計品質観点(機能性)
            aspects: [functional]
          - id: bd-func-spec
            name: 機能一覧・機能仕様（入力/処理/出力定義）
            purpose: INPUT/PROCESS/OUTPUT単位で外部仕様を確定する
            table_hint: "| 機能ID | 機能名 | INPUT | PROCESS | OUTPUT |"
            required: true
            source: 設計観点 S16
            aspects: [functional]
          - id: bd-processing
            name: 処理方式の選定・確認
            purpose: 処理方式を選定し非機能要件と整合させる
            required: true
            source: 設計観点 S13
            aspects: [performance]

      - id: bd-cat-ui
        label: 画面・帳票・インターフェース設計
        review_checklist:
          - 画面遷移に抜け・重複はないか／権限で見えない画面を考慮したか
          - API・外部IFの契約（要求/応答/エラー/認証）が定義されているか
          - メッセージ・エラー表示の体系が統一されているか
        items:
          - id: bd-screen
            name: 画面一覧・画面遷移設計
            purpose: 触れる画面と遷移を確定し漏れ・重複のないUI仕様にする
            table_hint: "| 画面ID | 画面名 | 遷移元→遷移先 | 主な操作 |"
            required: true
            source: 設計品質観点(機能性)
            aspects: [usability, functional]
          - id: bd-report
            name: 帳票一覧・帳票仕様
            purpose: 出力帳票の種類・様式・条件を明確化する
            table_hint: "| 帳票ID | 帳票名 | 出力条件 | 様式／媒体 |"
            required: conditional
            condition: 帳票・PDF等の出力機能がある場合
            source: 設計品質観点(機能性)
            aspects: [functional]
          - id: bd-io-item
            name: 入出力項目定義（データ項目・CRUD整理）
            purpose: 桁数・精度・編集書式を統一し漏れ・重複を防ぐ
            table_hint: "| 項目名 | 型・桁・精度 | 編集書式 | CRUD |"
            required: true
            source: 設計品質観点(機能性)
            aspects: [functional]
          - id: bd-message
            name: メッセージ一覧・エラーメッセージ仕様
            purpose: 通知・警告・エラーの内容と形式を統一する
            table_hint: "| メッセージID | 区分（通知／警告／エラー） | 文言 | 発生条件 |"
            required: true
            source: 設計品質観点(機能性)
            aspects: [usability, functional]
          - id: bd-menu
            name: コマンド・メニュー体系設計
            purpose: 名称体系・操作方法を統一し操作ミスを防止する
            required: false
            source: 設計品質観点(機能性)
            aspects: [usability]
          - id: bd-ext-if
            name: 外部インターフェース仕様（他システム連携）
            purpose: 電文構造・送受手順を明確化し連携整合性を保証する
            required: true
            source: 設計品質観点(機能性)
            aspects: [functional]
          - id: bd-api
            name: API仕様（エンドポイント/リクエスト・レスポンス/認証/エラー）
            purpose: Web/アプリ案件で内外のAPI契約を確定し実装・結合の齟齬を防ぐ（現代案件向け追補）
            required: conditional
            condition: WebAPI/RESTやモバイル連携を持つ場合
            source: 叩き台(API)を外部IF仕様として具体化
            aspects: [functional]

      - id: bd-cat-data
        label: データ設計
        review_checklist:
          - ER図のリレーション・キーに矛盾はないか
          - 容量・拡張の見積りがあるか
          - コード体系が標準・外部接続先と整合しているか
        items:
          - id: bd-erd
            name: ER図・DB論理設計
            purpose: テーブル間リレーションとデータ構造を明確化する
            required: true
            source: 設計品質観点(機能性)
            aspects: [functional]
          - id: bd-datafile
            name: データファイル仕様・DB拡張計画
            purpose: 拡張性・容量見積りを明確化し将来の業務拡大に備える
            required: true
            source: 設計品質観点(拡張性)
            aspects: [scalability]
          - id: bd-code
            name: コード設計（コード体系）
            purpose: コード体系化・標準採用・外部接続先との整合を取る
            table_hint: "| コード名 | 桁数・形式 | 採番規則／準拠標準 |"
            required: conditional
            condition: 業務コード体系・採番規則を定義する場合
            source: 設計品質観点(機能性)
            aspects: [functional]

      - id: bd-cat-nfr
        label: 非機能・横断設計
        review_checklist:
          - 認証・認可・ログ・監視が方針として定義されているか
          - 非機能のトレードオフが明示されているか
        items:
          - id: bd-nfr-policy
            name: 非機能要件方針（可用性/性能拡張性/保守性/業務運用性/移行性/セキュリティ/環境）
            purpose: 横断で揃える非機能レベルを基本設計段階で方針化する
            required: true
            source: 設計観点 S50／非機能観点
            aspects: [reliability, performance, scalability, operability, maintainability, portability, security, environment]
            expands: non_functional
          - id: bd-cross-cutting
            name: 横断的関心事（セキュリティ・プライバシー・可観測性）
            purpose: 機能ごとに見落としやすい横断要件を設計方針として明示する
            required: true
            source: "設計品質観点(Google: cross-cutting concerns)"
            aspects: [security, operability, reliability]
            new: true
          - id: bd-waf
            name: 非機能設計の5観点（信頼性・セキュリティ・コスト・運用・性能）
            purpose: 非機能方針をトレードオフを含めて具体化し、運用後の品質劣化を防ぐ
            required: true
            source: "設計品質観点(Microsoft: Well-Architected)"
            aspects: [reliability, security, operability, performance]
            new: true
          - id: bd-security
            name: セキュリティ方針（認証・アクセス制御の外部仕様）
            purpose: 認証方式・権限レベルを外部仕様として定義する
            required: true
            source: 設計品質観点(セキュリティ)
            aspects: [security]

      - id: bd-cat-decision
        label: 設計判断・品質・移行
        review_checklist:
          - 重要な設計判断に代替案と採否理由があるか
          - 未解決の設計リスクが列挙されているか
        items:
          - id: bd-critical
            name: 重点整理事項の識別
            purpose: クリティカルな処理を洗い出し優先して方針を固める
            required: true
            source: 設計観点 S79
            aspects: [reliability]
          - id: bd-alternatives
            name: 代替案・採否理由・設計リスク
            purpose: 実現案の比較、採用理由、未解決リスクを記録し、後続の判断を再現可能にする
            required: true
            source: "設計品質観点(Google: alternatives/risk)"
            aspects: [maintainability, reliability, documentation]
            new: true
          - id: bd-axis
            name: 設計展開の軸・観点の設定
            purpose: 詳細設計への展開軸を仮検討し手戻りを防ぐ
            required: false
            source: 設計観点 S25
            aspects: [maintainability]
          - id: bd-migration
            name: 移行方式・移行対象概要
            purpose: 一括/段階移行の方式・対象範囲を明確化する
            required: false
            source: 設計品質観点(移行性)
            aspects: [portability]
          - id: bd-quality-select
            name: 品質項目一覧の選択・設計方針への反映
            purpose: ISO25010系の観点を選択しプロジェクト特性に応じた設計方針として明文化する
            table_hint: "| 品質特性（ISO25010） | 採否 | 設計方針 |"
            required: true
            source: 設計観点 S102
            aspects: [documentation]
          - id: bd-doc-rule
            name: ドキュメント体系・命名規則の規定
            purpose: 管理番号体系・構成・改訂履歴ルールを定める
            required: false
            source: 設計品質観点(ドキュメンテーション)
            aspects: [documentation]

  # ---------------------------------------------------------------------------
  detailed_design:
    label: 詳細設計
    goal: 内部ロジック・処理詳細を、網羅的整理技法で漏れなく定義する
    audience: 第三者の技術者
    reading_hint: 実装者/テスター/運用セキュリティの3視点で読み分ける（PBR）
    legend:
      - "**太字** = 決定事項"
      - "⚠️ = リスク"
      - "❓ = 未決事項"
    pbr_guide:
      - "実装者視点で確認: ロジック・分岐・例外は実装可能な粒度か"
      - "テスター視点で確認: 状態・条件の組合せが網羅され検証可能か"
      - "運用/セキュリティ視点で確認: 障害時の再開・ログ・監視が定義されているか"
    categories:
      - id: dd-summary
        label: サマリ（最初に読む）
        items:
          - id: dd-adr-summary
            name: "実装判断サマリ（ADR: 決定／代替案／トレードオフ）"
            purpose: 内部設計の主要判断を第三者が検証できる形で一覧化する
            required: true
            source: 認知科学(ADR/Nygard)
            aspects: [maintainability, documentation]
            new: true

      - id: dd-cat-logic
        label: ロジック・制御設計
        review_checklist:
          - 状態×イベントが総当たりで網羅されているか
          - 条件分岐の組合せに漏れはないか
          - モジュール分割は再利用・試験しやすいか
        items:
          - id: dd-state-matrix
            name: 状態遷移図・状態遷移マトリクス
            purpose: 状態×イベントを総当たりで整理し網羅的内部仕様と試験項目を導出する
            table_hint: "| 状態＼イベント | E1 | E2 | … |（セルは遷移先状態／-）"
            required: true
            source: 設計観点 S26
            aspects: [functional, reliability]
          - id: dd-decision-table
            name: デシジョンテーブル・真理値表
            purpose: 処理条件の全組合せを漏れなく列挙し正当性・保守性を担保する
            table_hint: "| 条件／規則 | R1 | R2 | … |（条件 Y/N/-、動作 X）"
            required: true
            source: 設計観点 S43
            aspects: [functional, maintainability]
          - id: dd-flow
            name: 処理フロー・構造化チャート設計
            purpose: 順次・分岐・反復の3構造で記述しスパゲッティ化を防ぐ
            required: true
            source: 設計観点 S84
            aspects: [maintainability]
          - id: dd-module
            name: モジュール化・階層化設計（APの階層構造）
            purpose: 処理を階層化し分担開発・試験効率・再利用性を高める
            required: true
            source: 設計観点 S86
            aspects: [maintainability, scalability]
          - id: dd-sequence
            name: 内部処理シーケンス設計（階層別シーケンス図）
            purpose: 階層別に処理シーケンスを詳細化し区間・共通処理の実装方針を明確化する
            required: false
            source: 設計観点 S89
            aspects: [maintainability]

      - id: dd-cat-data
        label: データ・整合性設計
        review_checklist:
          - 重要データのC/U/Dが整理されているか
          - 排他制御（ロック方式）が選定されデッドロック回避が考慮されているか
          - DB物理構造が性能・拡張要件に合っているか
        items:
          - id: dd-crud
            name: CRUD分析（詳細設計版）
            purpose: 重要データへのC/U/Dを整理し内部データ管理の網羅性を確認する
            table_hint: "| 機能・処理＼データ | C | R | U | D |"
            required: true
            source: 設計観点 S29
            aspects: [functional]
          - id: dd-transaction
            name: 排他制御・トランザクション設計（悲観/楽観ロック）
            purpose: ロック方式を明示選択しデッドロック回避・区間最小化を設計に落とす
            required: true
            source: 設計観点 S64
            aspects: [reliability, performance]
          - id: dd-db-physical
            name: DB物理設計（物理構造・インデックス・パーティション）
            purpose: アクセスパターン・性能要件から物理構造を決定し性能と拡張性を両立する
            required: true
            source: 設計品質観点(機能性:RDB)
            aspects: [performance, scalability]

      - id: dd-cat-error
        label: 入力・例外・エラー設計
        review_checklist:
          - 入力チェックの順序・規定外時の対処が定義されているか
          - 業務例外が正常系に組み込まれているか
          - エラーごとに一意なID/メッセージがあるか
        items:
          - id: dd-input-check
            name: 入力データチェック仕様
            purpose: チェック順序・内容・規定外/省略時対処を詳細化し不正データ混入を防ぐ
            table_hint: "| 項目 | チェック内容 | 規定外・省略時の対処 |"
            required: true
            source: 設計品質観点(機能性)
            aspects: [functional, security]
          - id: dd-exception
            name: 例外処理・準正常系設計
            purpose: 業務例外（在庫切れ等）を正常系に組み込んで設計し想定外障害を防ぐ
            required: true
            source: 設計観点 S71
            aspects: [reliability]

          - id: dd-errorcode
            name: エラーコード・メッセージ詳細仕様
            purpose: エラー条件ごとに一意なID/メッセージを割当て原因調査性を高める
            table_hint: "| エラーID | メッセージ | 発生条件 | 対処 |"
            required: true
            source: 設計観点 S45
            aspects: [maintainability, usability]

      - id: dd-cat-reliability
        label: 信頼性・性能・運用設計
        review_checklist:
          - 障害後の再開・リカバリ手順があるか
          - ピーク負荷で性能目標を満たせる算定があるか
          - 障害検知・原因特定に必要なログ/メトリクスが定義されているか
        items:
          - id: dd-batch
            name: バッチ処理詳細設計（リラン/リスタート、ジョブスケジュール）
            purpose: 起動サイクル・処理時間・リラン救済単位を詳細化し運用トラブルに備える
            required: conditional
            condition: バッチ処理を持つ場合
            source: 設計品質観点(運用性)
            aspects: [operability, reliability]
          - id: dd-recovery
            name: リカバリ・障害時処理詳細設計
            purpose: ダウン後の再開・ファイルリカバリ手順を設計し復旧を保証する
            required: true
            source: 設計品質観点(信頼性)
            aspects: [reliability]
          - id: dd-performance
            name: 性能詳細設計（スループット/TAT見積り、リソース負荷算定）
            purpose: ピーク負荷を定量算定し性能目標の達成可能性を検証する
            required: true
            source: 設計品質観点(性能)
            aspects: [performance]
          - id: dd-observability
            name: 監視・診断・インシデント対応の詳細設計
            purpose: 障害の検知、原因特定、復旧判断に必要なログ・メトリクス・手順を実装可能にする
            required: true
            source: "設計品質観点(Microsoft: Operational Excellence)"
            aspects: [operability, reliability, security]
            new: true

      - id: dd-cat-quality
        label: 品質確認
        review_checklist:
          - 前後機能との整合・解釈の一意性・実装可能性が確認されているか
        items:
          - id: dd-spec-quality
            name: 機能仕様の完全性・明確性・実装可能性確認
            purpose: 前後機能との整合、解釈の一意性、実装と見積りに十分な具体性を確認する
            required: true
            source: "設計品質観点(NTTデータ: 機能仕様チェック)"
            aspects: [functional, maintainability, documentation]
            new: true

# =============================================================================
# 非機能要件 明細（IPA非機能要求グレード）
#   req-nfr-breakdown / bd-nfr-policy から expands 参照される共有定義
# =============================================================================
non_functional:
  label: 非機能要件（IPA非機能要求グレード）
  source: 非機能観点
  major_items:
    - id: nf-availability
      label: 可用性
      required: true
      sub_items:
        - {name: 継続性,   metric: 運用時間/稼働率/RTO/RPO}
        - {name: 耐障害性, metric: 機器/コンポーネント/ディスクの冗長化レベル}
        - {name: 災害対策, metric: DRサイト/データ外部保管/再開目標日数}
        - {name: 回復性,   metric: 復旧作業の自動化/代替業務運用範囲}
    - id: nf-performance
      label: 性能・拡張性
      required: true
      sub_items:
        - {name: 業務処理量,   metric: ユーザ数/同時数/データ量/処理件数}
        - {name: 性能目標値,   metric: レスポンス順守率/スループット/帳票印刷能力}
        - {name: リソース拡張性, metric: 利用率上限/拡張倍率/スケールアップ・アウト}
        - {name: 性能品質保証, metric: 帯域保証/性能テスト頻度/スパイク対応}
    - id: nf-operation
      label: 運用・保守性
      required: true
      sub_items:
        - {name: 通常運用,   metric: 運用時間/バックアップ方式/監視レベル}
        - {name: 保守運用,   metric: 計画停止頻度/パッチ適用方針/保守自動化率}
        - {name: 障害時運用, metric: 復旧自動化/駆けつけ時間/交換部材}
        - {name: 運用環境,   metric: 開発試験環境/マニュアル/リモート操作}
        - {name: サポート体制, metric: 保守契約範囲/ライフサイクル/対応時間帯}
        - {name: その他運用管理方針, metric: インシデント/問題/構成/変更/リリース管理, required: false}
    - id: nf-portability
      label: 移行性
      required: false
      sub_items:
        - {name: 移行時期,       metric: 移行期間/停止可能日数/並行稼働}
        - {name: 移行方式,       metric: 拠点・業務展開ステップ数}
        - {name: 移行対象(機器), metric: 設備入れ替え範囲}
        - {name: 移行対象(データ), metric: 移行データ量/形式差異/変換ルール数}
        - {name: 移行計画,       metric: 作業分担/リハーサル回数/トラブル対処規定}
    - id: nf-security
      label: セキュリティ
      required: true
      sub_items:
        - {name: 前提条件・制約条件,   metric: 準拠法令/資格認証/ガイドライン}
        - {name: セキュリティリスク分析, metric: リスク分析対象範囲}
        - {name: セキュリティ診断,     metric: NW/Web/DB脆弱性診断の実施}
        - {name: セキュリティリスク管理, metric: リスク見直し頻度/パッチ適用方針}
        - {name: アクセス・利用制限,   metric: 認証方式/操作制限/認証情報管理}
        - {name: データの秘匿,         metric: 伝送/蓄積の暗号化/鍵管理}
        - {name: 不正追跡・監視,       metric: ログ取得/保管期間/監視範囲}
        - {name: ネットワーク対策,     metric: FW/IPS/DoS対策}
        - {name: マルウェア対策,       metric: 対策範囲/スキャン頻度}
        - {name: Web対策,             metric: セキュアコーディング/WAF}
        - {name: インシデント対応/復旧, metric: 対応体制の有無}
    - id: nf-environment
      label: システム環境・エコロジー
      required: false
      sub_items:
        - {name: システム制約/前提条件, metric: 社内基準/法令/条例}
        - {name: システム特性,         metric: ユーザ数/拠点数/対応言語数}
        - {name: 適合規格,             metric: UL60950/RoHS/VCCI等}
        - {name: 機材設置環境条件,     metric: 耐震/床荷重/電源/温湿度/空調}
        - {name: 環境マネージメント,   metric: 省エネ/CO2/騒音値}

# =============================================================================
# 生成AI活用開発の品質管理観点（横断チェックリスト）
#   本SKILLの「生成→穴埋め→カバレッジ評価」プロセス自体の品質保証に使う。
#   運用方法は evaluation/ai-quality-rubric.md を参照。
# =============================================================================
ai_quality_perspectives:
  label: 生成AI活用開発の品質管理観点
  source: AI品質観点
  items:
    - {id: aiq-risk-typing,   name: 生成AI特有リスクの類型化,   purpose: ハルシネーション/ブラックボックス性/評価困難性/著作権等を事前把握, source: "AI品質観点 2.1"}
    - {id: aiq-human-review,  name: 成果物の人間レビュー原則,   purpose: AI生成物は必ず人が最終確認し逸脱を修正, source: "AI品質観点 2.3-1"}
    - {id: aiq-poc,           name: PoCによる品質影響の事前検証, purpose: 導入前にPoCで品質影響と品質水準の妥当性を検証, source: "AI品質観点 2.3-2"}
    - {id: aiq-input-quality, name: インプット品質の確保,       purpose: 各フェーズで入力情報の質を高め後続への悪影響を最小化, source: "AI品質観点 2.3-3"}
    - {id: aiq-prompt-mgmt,   name: プロンプトの管理・改善,     purpose: テンプレを構成管理し評価を通じ継続改善, source: "AI品質観点 2.3-4"}
    - {id: aiq-knowledge,     name: ナレッジの蓄積と横展開,     purpose: 良否事例をテンプレ/チェックリスト化し他PJへ展開, source: "AI品質観点 2.3-5"}
    - {id: aiq-plan-extra,    name: 追加作業を見込んだ計画,     purpose: 要求欠損/実装漏れ/AI障害等の追加作業を計画に反映, source: "AI品質観点 2.3-6"}
    - {id: aiq-qa-story,      name: 品質保証ストーリーへの反映, purpose: PJ特性からAIリスクを洗い出し各フェーズの確認方法を明文化, source: "AI品質観点 3.2"}
    - {id: aiq-qc-plan,       name: 品質管理計画への考慮点追加, purpose: レビュー計画/問題記述にAI起因問題の検出観点を組込む, source: "AI品質観点 3.3"}
    - {id: aiq-design-test-view, name: 設計観点・テスト観点の追加, purpose: 既存観点で検出できないエラーがないか確認し観点を追加, source: "AI品質観点 3.4"}
    - {id: aiq-quant-qual,    name: 定量・定性の両面評価,       purpose: エラー摘出密度等の定量＋再現性を踏まえた定性評価, source: "AI品質観点 3.5"}
    - {id: aiq-hallucination, name: ハルシネーション・整合性確認, purpose: インプットが解釈誤り・抜け漏れなく反映され他成果物と整合するか, source: "AI品質観点 4.2"}
    - {id: aiq-cross-review,  name: 生成AIレビューの見落とし対策, purpose: 別AIのクロスレビューや人手切替の基準を設ける, source: "AI品質観点 4.4/4.6"}
    - {id: aiq-coding-cover,  name: コーディング規約・条件網羅性, purpose: 例外/エラー処理の条件網羅を確認, source: "AI品質観点 4.5"}
    - {id: aiq-test-cover,    name: テスト資材の網羅性・妥当性,  purpose: 境界値/異常系/条件分岐の網羅と非実在前提の排除を確認, source: "AI品質観点 4.7"}
    - {id: aiq-prompt-fact,   name: プロンプトのレビュー観点,   purpose: 「わからない」明言/推測明示/根拠出典明記でハルシ抑制, source: "AI品質観点 5.1"}
    - {id: aiq-quality-level, name: 品質水準の設定方法,         purpose: 過去データ/PoC結果/削減割合を根拠に評価基準を設定, source: "AI品質観点 5.2"}
    - {id: aiq-poc-metrics,   name: PoCの定量・定性評価項目,    purpose: 網羅率/適用率/安定性(再実行のばらつき)で検証, source: "AI品質観点 5.3"}
    - {id: aiq-case-feedback, name: プロジェクト事例の反映,     purpose: レビューのボトルネック化/出力ばらつき等を踏まえ継続改善, source: "AI品質観点 6.2"}
    - {id: aiq-role-split,    name: 生成AI活用の作業配分見直し, purpose: AIが生成/判定・人が補完/最終判定と役割分担し責任所在を保つ, source: "AI品質観点 6.2-5"}
