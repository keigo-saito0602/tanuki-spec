name: screen-mock-checks

on:
  push:
    branches: [master]
    paths:
      - "skills/tanuki-spec-screen-mock/**"
      - "tanuki-spec-all/**"
      - "tests/**"
      - ".github/workflows/screen-mock-checks.yml"
  pull_request:
    paths:
      - "skills/tanuki-spec-screen-mock/**"
      - "tanuki-spec-all/**"
      - "tests/**"
      - ".github/workflows/screen-mock-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tanuki-spec-all/requirements.txt
          pip install -r skills/tanuki-spec-screen-mock/requirements.txt

      - name: Install Chromium (実ブラウザ検査用)
        run: python -m playwright install --with-deps chromium

      - name: 文書同期テスト（ルート）
        run: python -m unittest discover -s tests -v

      - name: tanuki-spec-screen-mockのテスト（静的検証・実ブラウザ検査を含む）
        run: python -m unittest discover -s skills/tanuki-spec-screen-mock/scripts -v
