version: "1.0"

user_stories:
  - id: US-001
    status: in_scope
    statement: "生徒は空きレッスン枠を確認して予約したい。DMでのやり取りをなくすため。"
  - id: US-002
    status: in_scope
    statement: "生徒は予約をキャンセルしたい。都合が変わった枠を他の生徒に譲るため。"
  - id: US-003
    status: in_scope
    statement: "生徒は予約確定を通知で確認したい。予約が受け付けられたことを知るため。"

business_flows:
  - id: BF-001
    status: in_scope
    name: "レッスン枠の予約・キャンセル"
    steps:
      - id: BF-001-S01
        action: "生徒が空き枠を確認する"
        user_story_ids: [US-001]
      - id: BF-001-S02
        action: "生徒が空き枠を選択して予約を確定する"
        user_story_ids: [US-001, US-003]
      - id: BF-001-S03
        action: "生徒が予約をキャンセルし、枠を空きへ戻す"
        user_story_ids: [US-002]

requirements:
  - id: BR-001
    status: in_scope
    type: business
    statement: "講師の手動台帳記入を廃止し、予約確定とキャンセルを業務記録として残す"
    user_story_ids: [US-001, US-002]
    flow_step_ids: [BF-001-S02, BF-001-S03]
  - id: FR-001
    status: in_scope
    type: functional
    statement: "生徒は日時・講師・残席を含む空き枠一覧を閲覧できる"
    user_story_ids: [US-001]
    flow_step_ids: [BF-001-S01]
  - id: FR-002
    status: in_scope
    type: functional
    statement: "生徒は空き枠を予約でき、確定時に通知を受け取る"
    user_story_ids: [US-001, US-003]
    flow_step_ids: [BF-001-S02]
  - id: FR-003
    status: in_scope
    type: functional
    statement: "生徒はレッスン前日まで予約をキャンセルでき、枠を空きへ戻せる"
    user_story_ids: [US-002]
    flow_step_ids: [BF-001-S03]
  - id: NFR-001
    status: in_scope
    type: non_functional
    statement: "同一の最終1枠に同時に予約要求が来ても、確定する予約は1件だけとする"
    user_story_ids: [US-001]
    flow_step_ids: [BF-001-S02]

acceptance_tests:
  - id: AC-001
    status: in_scope
    user_story_ids: [US-001]
    requirement_ids: [FR-001]
    flow_step_ids: [BF-001-S01]
    preconditions: ["ログイン済みで、予約可能な枠が1件以上ある"]
    steps: ["空き枠一覧を開く"]
    expected_results: ["日時・講師・残席を含む予約可能な枠だけが表示される"]
  - id: AC-002
    status: in_scope
    user_story_ids: [US-001, US-003]
    requirement_ids: [BR-001, FR-002, NFR-001]
    flow_step_ids: [BF-001-S02]
    preconditions: ["ログイン済みで、残席が1以上の枠がある"]
    steps: ["空き枠を選択し予約を確定する"]
    expected_results: ["予約が1件作成され、残席が減り、確定通知が届く"]
  - id: AC-003
    status: in_scope
    user_story_ids: [US-002]
    requirement_ids: [BR-001, FR-003]
    flow_step_ids: [BF-001-S03]
    preconditions: ["ログイン済みで、前日以前の自分の予約がある"]
    steps: ["対象の予約をキャンセルする"]
    expected_results: ["予約がキャンセルされ、対象枠が空きへ戻る"]

system_tests:
  - id: ST-001
    status: in_scope
    test_type: functional
    requirement_ids: [FR-001]
    acceptance_test_ids: [AC-001]
    preconditions: ["空き枠・満席枠・締切枠をテストデータとして登録済み"]
    steps: ["生徒として空き枠一覧APIを実行する"]
    expected_results: ["空き枠だけが日時・講師・残席付きで返る"]
  - id: ST-002
    status: in_scope
    test_type: integration
    requirement_ids: [BR-001, FR-002]
    acceptance_test_ids: [AC-002]
    preconditions: ["空き枠があり、通知サービスが利用可能"]
    steps: ["予約確定APIを実行する"]
    expected_results: ["予約記録が作成され、残席が減り、通知送信が成功する"]
  - id: ST-003
    status: in_scope
    test_type: functional
    requirement_ids: [BR-001, FR-003]
    acceptance_test_ids: [AC-003]
    preconditions: ["キャンセル可能期限内の予約がある"]
    steps: ["予約キャンセルAPIを実行する"]
    expected_results: ["予約状態がキャンセルになり、残席が1増える"]
  - id: ST-004
    status: in_scope
    test_type: non_functional
    requirement_ids: [NFR-001]
    acceptance_test_ids: [AC-002]
    preconditions: ["残席1の同一枠があり、2つの並行リクエストを送信できる"]
    steps: ["同一枠へ同時に2件の予約確定APIを実行する"]
    expected_results: ["成功は1件だけで、予約記録と残席の整合性が保たれる"]
