# 画面モックで使える部品とレイアウトの正本。
# screens.yaml はここに列挙された値だけを使う。
# ここにない表現が必要になったら、勝手に追加せず [要確認] として報告する。

# 部品: 画面の中に上から順に並べる要素。
blocks:
  - header            # 画面上部のタイトルとナビゲーション
  - sidebar           # 画面左の縦ナビゲーション
  - breadcrumb        # 現在地を示すパンくず
  - stepper           # ウィザードの進捗表示
  - filter-bar        # 一覧の絞り込み条件
  - table             # 行と列のデータ表
  - card-grid         # カードを格子状に並べた一覧
  - list              # 縦一列の項目リスト
  - form-section      # 入力項目のまとまり
  - field             # 単独の入力項目
  - button-row        # 操作ボタンの並び
  - modal             # 重ねて表示する確認ダイアログ
  - tabs              # 内容の切り替えタブ
  - kpi-tile          # 数値を大きく見せる指標タイル
  - chart-placeholder # グラフの位置と種類だけを示す枠
  - empty-state       # 0件のときの案内
  - alert             # 注意・エラー・成功の通知
  - pagination        # ページ送り
  - footer            # 画面下部の補足情報
  - loading           # 読み込み中の表示

# レイアウト: 外枠の骨組み（カラム数・サイドバーの有無・本文の最大幅）を決める。
# required はその画面に必ず置く部品、forbidden はそのレイアウトでは置けない部品。
layouts:
  list-with-filter:
    required: [header, filter-bar]
    forbidden: [stepper, kpi-tile]
  detail:
    required: [header]
    forbidden: [stepper, filter-bar, pagination]
  form:
    required: [header, form-section, button-row]
    forbidden: [stepper, filter-bar, pagination, kpi-tile]
  wizard:
    required: [header, stepper, form-section, button-row]
    forbidden: [filter-bar, pagination, kpi-tile]
  dashboard:
    required: [header, kpi-tile]
    forbidden: [stepper, pagination]
  auth:
    required: [form-section, button-row]
    forbidden: [header, sidebar, stepper, filter-bar, pagination, kpi-tile, tabs]
  error:
    required: [alert, button-row]
    forbidden: [sidebar, stepper, filter-bar, pagination, kpi-tile, tabs, table]
  landing:
    required: [header, footer]
    forbidden: [stepper, filter-bar, pagination, table]

# 状態表現部品。これらは blocks[].state が必須。それ以外の部品では state は禁止。
state_required: [empty-state, alert, loading]

# 部品ごとに表せる状態。汎用の alert だけ複数状態を許す。
state_components:
  empty-state: [empty]
  loading:     [loading]
  alert:       [error, forbidden]
