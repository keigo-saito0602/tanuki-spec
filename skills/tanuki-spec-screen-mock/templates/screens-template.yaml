# 画面定義の雛形。<>で囲まれた箇所を実際の内容へ置き換える。
# 根拠がない項目は埋めず、notesへ [要確認: 質問] を残す。
meta:
  phase: "<phase-N_フェーズ名>"
  source_spec: "01_要件定義書.md"
  generated_at: "2026-07-30"  # YYYY-MM-DD形式。実行日に置き換える
  entry_screens: ["SC-001"]

screens:
  - id: SC-001
    name: "<画面名>"
    purpose: "<この画面でユーザが達成すること。1文>"
    actor: "<操作する役割>"
    layout: list-with-filter
    trace: ["<FR-001>"]
    blocks:
      - type: header
        nav: ["<メニュー1>", "<メニュー2>"]
      - type: filter-bar
        fields:
          - label: "<絞り込み項目>"
            control: text
            required: false
      - type: card-grid
        item_label: "<一覧の1件の呼び名>"
        item_fields: ["<表示項目1>", "<表示項目2>"]
      - type: empty-state
        state: empty
        message: "<0件のときの案内と次の行動>"
      - type: loading
        state: loading
      - type: alert
        state: error
        message: "<失敗理由と復旧手段>"
    states:
      normal: "<データがある平常時の表示>"
      empty: "<0件のときの案内と次の行動>"
      loading: "<待たせる場合の表示>"
      error: "<失敗理由と復旧手段>"
      forbidden: "該当なし: <理由>"
    transitions:
      - action: "<操作名>"
        to: SC-002
        kind: forward
    notes: []

  - id: SC-002
    name: "<画面名>"
    purpose: "<この画面でユーザが達成すること。1文>"
    actor: "<操作する役割>"
    layout: form
    trace: ["<FR-002>"]
    blocks:
      - type: header
        nav: ["<メニュー1>"]
      - type: form-section
        fields:
          - label: "<入力項目>"
            control: text
            required: true
            constraint: "<入力制限>"
            error: "<エラー文言>"
      - type: button-row
        buttons: ["<主操作>"]
      - type: loading
        state: loading
      - type: alert
        state: error
        message: "<失敗理由と復旧手段>"
      - type: alert
        state: forbidden
        message: "<見えない・押せない場合の扱い>"
    states:
      normal: "<データがある平常時の表示>"
      empty: "該当なし: <理由>"
      loading: "<待たせる場合の表示>"
      error: "<失敗理由と復旧手段>"
      forbidden: "<見えない・押せない場合の扱い>"
    terminal: true
    transitions:
      - action: "<戻る操作>"
        to: SC-001
        kind: back
      - action: "<保存に失敗したとき>"
        to: SC-E01
        kind: forward
    notes: []

  # エラー画面。layout: error は alert と button-row が必須で、
  # alert には state（error または forbidden）が要る。
  - id: SC-E01
    name: "<エラー画面名>"
    purpose: "<失敗した理由を伝え、元の作業へ戻す>"
    actor: "<操作する役割>"
    layout: error
    trace: ["<FR-003>"]
    blocks:
      - type: header
        nav: ["<メニュー1>"]
      - type: alert
        state: error
        message: "<失敗理由と復旧手段>"
      - type: button-row
        buttons: ["<一覧へ戻る>"]
    states:
      normal: "該当なし: エラーを伝えるためだけの画面で平常時の表示がない"
      empty: "該当なし: 一覧を持たない"
      loading: "該当なし: 遷移した時点で表示が確定している"
      error: "<失敗理由と復旧手段>"
      forbidden: "該当なし: <理由>"
    transitions:
      - action: "<一覧へ戻る>"
        to: SC-001
        kind: back
    notes: []
