# 画面定義の雛形。<>で囲まれた箇所を実際の内容へ置き換える。
# 根拠がない項目は埋めず、notesへ [要確認: 質問] を残す。
meta:
  phase: "<phase-N_フェーズ名>"
  source_spec: "01_要件定義書.md"
  generated_at: "<YYYY-MM-DD>"
  entry_screens: ["SC-001"]

screens:
  - id: SC-001
    name: "<画面名>"
    purpose: "<この画面でユーザが達成すること。1文>"
    actor: "<操作する役割>"
    layout: list-with-filter
    trace: ["<FR-001>"]
    design_question: "<このモックでレビューして決めたい問い>"
    hypothesis: "<現時点で置く利用者・業務上の仮説>"
    risk: medium
    validation_task: "<レビュー参加者が行う具体的な操作・確認課題>"
    rationale: "<画面構成・導線・既存UIとの差分を採用した根拠>"
    exploration_mode: compare
    alternatives:
      - id: alt-a
        name: "<代替案A>"
        summary: "<案Aの情報構造・導線の要約>"
        decision: adopted
        reason: "<採用理由>"
      - id: alt-b
        name: "<代替案B>"
        summary: "<案Bの情報構造・導線の要約>"
        decision: rejected
        reason: "<却下理由>"
    blocks:
      - type: header
        nav: ["<メニュー1>", "<メニュー2>"]
      - type: filter-bar
        fields:
          - label: "<絞り込み項目>"
            control: text
            required: false
      - type: card-grid
        item_label: "<一覧の1件の呼び名>"
        item_fields: ["<表示項目1>", "<表示項目2>"]
      - type: empty-state
        state: empty
        message: "<0件のときの案内と次の行動>"
      - type: loading
        state: loading
      - type: alert
        state: error
        message: "<失敗理由と復旧手段>"
    states:
      normal: "<データがある平常時の表示>"
      empty: "<0件のときの案内と次の行動>"
      loading: "<待たせる場合の表示>"
      error: "<失敗理由と復旧手段>"
      forbidden: "該当なし: <理由>"
    state_strategy:
      priority_states: [normal, empty, error]
      rationale: "<この画面で重点的にレビューする状態と、その理由>"
    transitions:
      - action: "<操作名>"
        to: SC-002
        kind: forward
    notes: []

  - id: SC-002
    name: "<画面名>"
    purpose: "<この画面でユーザが達成すること。1文>"
    actor: "<操作する役割>"
    layout: form
    trace: ["<FR-002>"]
    design_question: "<このモックでレビューして決めたい問い>"
    hypothesis: "<現時点で置く利用者・業務上の仮説>"
    risk: medium
    validation_task: "<レビュー参加者が行う具体的な操作・確認課題>"
    rationale: "<画面構成・導線・既存UIとの差分を採用した根拠>"
    exploration_mode: inherit
    inherited_from: "<継承する既存画面・デザインシステム・業務パターン>"
    alternatives:
      - id: alt-a
        name: "<継承する既存パターン>"
        summary: "<継承する情報構造・導線の要約>"
        decision: adopted
        reason: "<今回も利用者・業務・制約に適合する理由>"
    blocks:
      - type: header
        nav: ["<メニュー1>"]
      - type: form-section
        fields:
          - label: "<入力項目>"
            control: text
            required: true
            constraint: "<入力制限>"
            error: "<エラー文言>"
      - type: button-row
        buttons: ["<主操作>"]
      - type: loading
        state: loading
      - type: alert
        state: error
        message: "<失敗理由と復旧手段>"
      - type: alert
        state: forbidden
        message: "<見えない・押せない場合の扱い>"
    states:
      normal: "<データがある平常時の表示>"
      empty: "該当なし: <理由>"
      loading: "<待たせる場合の表示>"
      error: "<失敗理由と復旧手段>"
      forbidden: "<見えない・押せない場合の扱い>"
    state_strategy:
      priority_states: [normal, loading, error]
      rationale: "<この画面で重点的にレビューする状態と、その理由>"
    terminal: true
    transitions:
      - action: "<戻る操作>"
        to: SC-001
        kind: back
      - action: "<保存に失敗したとき>"
        to: SC-E01
        kind: forward
    notes: []

  # エラー画面。layout: error は alert と button-row が必須で、
  # alert には state（error または forbidden）が要る。
  - id: SC-E01
    name: "<エラー画面名>"
    purpose: "<失敗した理由を伝え、元の作業へ戻す>"
    actor: "<操作する役割>"
    layout: error
    trace: ["<FR-003>"]
    design_question: "<失敗から元の作業へ復旧できるか>"
    hypothesis: "<エラー理由と復旧操作を同時に示せば、作業を再開できる>"
    risk: high
    validation_task: "<エラーの原因を説明し、元の作業へ戻る操作を選んでください>"
    rationale: "<元画面では安全に復旧できない条件と、専用画面から戻す理由>"
    exploration_mode: compare
    alternatives:
      - id: alt-inline
        name: "元画面内で通知"
        summary: "元画面にエラーと再試行を表示する"
        decision: rejected
        reason: "セッションや処理状態が無効な場合は元画面内で安全に再試行できないため"
      - id: alt-error-screen
        name: "専用エラー画面"
        summary: "エラーだけを独立画面で表示する"
        decision: adopted
        reason: "無効になった処理を中断し、安全な入口へ戻す必要があるため"
    blocks:
      - type: header
        nav: ["<メニュー1>"]
      - type: alert
        state: error
        message: "<失敗理由と復旧手段>"
      - type: button-row
        buttons: ["<一覧へ戻る>"]
    states:
      normal: "該当なし: エラーを伝えるためだけの画面で平常時の表示がない"
      empty: "該当なし: 一覧を持たない"
      loading: "該当なし: 遷移した時点で表示が確定している"
      error: "<失敗理由と復旧手段>"
      forbidden: "該当なし: <理由>"
    state_strategy:
      priority_states: [error]
      rationale: "<失敗理由と復旧導線がこの画面の主要な検証対象のため>"
    transitions:
      - action: "<一覧へ戻る>"
        to: SC-001
        kind: back
    notes: []
