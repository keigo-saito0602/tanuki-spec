    status: in_scope # in_scope / deferred / out_of_scope。後者2つはreason必須
    title: "<作成または変更する成果物>"
    type: backend # design / data / backend / frontend / integration / test / verification / documentation
    requirement_ids: [FR-001]
    acceptance_test_ids: [AC-001]
    system_test_ids: [ST-001]
    depends_on: []
    definition_of_done: ["<完了と判断できる成果物の状態>"]
    verification: ["<実行するテストまたは確認手順>"]
    # 以下3項目は任意。進捗管理とMermaidガント生成に使う（無くてもゲートは通る）
    # progress: todo   # todo / doing / done。in_scope以外のタスクには付けられない
    # duration: 3d     # 数字 + h/d/w（例: 4h, 2.5d, 1w）
    # start_date: "2026-08-01"  # YYYY-MM-DD。必ずクォートで囲む（裸で書くとYAMLがdate型として解釈し検査に失敗する）
